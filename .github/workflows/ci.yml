# =============================================================================
# CI/CD Pipeline - Sistema de Reembolso
# =============================================================================
# Este workflow executa:
# - Lint e Type Check
# - Testes automatizados com cobertura
# - Build de produção
# (o deploy é feito pela Vercel: https://sistema-de-reembolso-two.vercel.app/)
# =============================================================================

name: CI/CD Pipeline

on:
  # Executa em push para main e develop
  push:
    branches: ['main', 'develop']
  
  # Executa em Pull Requests para main
  pull_request:
    branches: ['main']
  
  # Permite execução manual via GitHub Actions UI
  workflow_dispatch:

# Permissões mínimas: só leitura
permissions:
  contents: read

# Evita execuções duplicadas
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# JOBS
# =============================================================================

jobs:
  # ===========================================================================
  # JOB 1: Lint, Type Check e Testes
  # ===========================================================================
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Lint
      # -----------------------------------------------------------------------
      - name: 🔎 ESLint Check
        run: npm run lint

      - name: 💅 Prettier Check
        run: npm run format:check

      # -----------------------------------------------------------------------
      # Type Check
      # -----------------------------------------------------------------------
      - name: 🔍 TypeScript Type Check
        run: npx tsc --noEmit

      # -----------------------------------------------------------------------
      # Testes
      # -----------------------------------------------------------------------
      - name: 🧪 Run tests with coverage
        run: npm run test:coverage

      # -----------------------------------------------------------------------
      # Upload Coverage
      # -----------------------------------------------------------------------
      - name: 📊 Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ===========================================================================
  # JOB 2: Build
  # ===========================================================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔨 Build application
        run: npm run build

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
